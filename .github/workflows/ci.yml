name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-linux:
    name: Swift / Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v6
      - run: swift test --enable-swift-testing --disable-xctest -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -warnings-as-errors
  swift-macos:
    name: Swift / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test --enable-swift-testing --disable-xctest -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -warnings-as-errors
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
